<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Araucanía Smart | Gracias</title>

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-light: #111827;
            --primary: #38bdf8;
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .card {
            background-color: var(--bg-light);
            padding: 50px 40px;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1.05rem;
        }

        a {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 6px;
            background-color: var(--primary);
            color: #020617;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Gracias por contactarnos</h1>
        <p>
            Hemos recibido tu mensaje correctamente.<br>
            Revisaremos la información y te responderemos a la brevedad.
        </p>

        <a href="/">Volver al sitio</a>
    </div>
</body>
</html>
